name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go mod tidy (no diff)
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: verify generated OpenAPI code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- api/command/gen api/query/gen

      # Runs the full suite, including testcontainers-backed integration tests
      # (internal/eventstore/postgres, internal/projection/universe) — ubuntu-latest runners
      # have Docker preinstalled, so testcontainers talks to it directly with no extra
      # `services:` containers needed here.
      - name: go test
        run: go test ./... -timeout 5m

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: verify generated API clients are up to date
        working-directory: web
        run: |
          npm run generate
          git diff --exit-code -- src/api/command.types.ts src/api/query.types.ts

      - name: typecheck
        working-directory: web
        run: npm run typecheck

      - name: build
        working-directory: web
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    # Non-blocking for now: no golangci-lint release yet ships a toolchain that can
    # type-check a module declaring `go 1.26` in go.mod (it's a hard panic in go/types
    # itself when the analyzing toolchain is older than the target — not something a
    # golangci-lint config can route around). `go vet` in build-test is the enforced static
    # check in the meantime; flip continue-on-error off once golangci-lint catches up.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
