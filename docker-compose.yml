services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: timadorus
      POSTGRES_PASSWORD: timadorus
      POSTGRES_DB: timadorus
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timadorus"]
      interval: 2s
      timeout: 2s
      retries: 30

  nats:
    image: nats:2-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
