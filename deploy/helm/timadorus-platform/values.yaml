# Default values for timadorus-platform.

commandApi:
  image:
    repository: timadorus/command-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  route:
    hostname: ""

queryApi:
  image:
    repository: timadorus/query-api
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8082
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  route:
    hostname: ""

web:
  image:
    repository: timadorus/web
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  route:
    hostname: ""
  # Runtime config.json served to the browser at boot (design spec §9) — command/query API
  # base URLs and OIDC settings the SPA needs, resolved at install time, never baked into the
  # JS bundle.
  config:
    commandApiBaseUrl: ""
    queryApiBaseUrl: ""
    oidc:
      authority: ""
      clientId: ""
      redirectUri: ""
      postLogoutRedirectUri: ""

projector:
  image:
    repository: timadorus/projector
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8083
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

timadorusEngine:
  image:
    repository: timadorus/timadorus-engine
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  containerPort: 8084
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

migration:
  image:
    repository: timadorus/migrate
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

postgres:
  # Name of a pre-existing Secret in the release namespace holding a full DATABASE_URL
  # (e.g. postgres://user:pass@host:5432/db?sslmode=...). Required — the chart never
  # templates this Secret itself.
  existingSecret: ""
  secretKey: "DATABASE_URL"

nats:
  # true: deploy NATS JetStream as a subchart dependency of this release.
  # false: use nats.externalURL instead.
  enabled: true
  externalURL: ""
  config:
    jetstream:
      enabled: true

jwt:
  # "jwks" or "hmac" — selects which of the two blocks below is used.
  mode: jwks
  jwksURL: ""
  # jwksHost, if set, overrides the Host header command-api/query-api send when fetching
  # jwksURL — needed when jwksURL is a network address (e.g. a Kubernetes-internal Service
  # DNS name) that differs from the identity provider's own externally-configured domain; see
  # internal/auth.FetchJWKS's doc comment. Empty by default (no override sent).
  jwksHost: ""
  issuer: ""
  audience: ""
  hmac:
    existingSecret: ""
    secretKey: "JWT_HMAC_SECRET"
    keyID: "dev"

gateway:
  # true: chart creates its own Gateway (gatewayClassName required below).
  # false: attach both HTTPRoutes to an existing Gateway (gateway.existing.* required below).
  create: true
  gatewayClassName: ""
  # listenerPort is the Gateway object's own spec.listeners[0].port (HTTP listener) — NOT
  # necessarily the port a human/browser actually connects to (that's whatever the Gateway
  # controller's own Service exposes, e.g. 80 via a LoadBalancer/NodePort/ClusterIP mapping).
  # The no-op placeholder GatewayClass (test-e2e's default; see test/e2e's InstallGatewayAPI)
  # doesn't reconcile this at all, so 80 (the obvious default) works fine there. A REAL
  # controller does validate it: Traefik's Kubernetes Gateway provider only accepts a Listener
  # whose port matches one of Traefik's own configured entryPoint ports — its default "web"
  # entryPoint listens on port 8000 internally (its Service then maps external port 80 to that
  # 8000, see the traefik/traefik chart's ports.web.port vs. ports.web.exposedPort), not 80
  # directly (binding 80 in-container needs CAP_NET_BIND_SERVICE, which Traefik's chart
  # deliberately doesn't grant — hardening default). Reproduced live: with this left at 80
  # against a real Traefik GatewayClass, the Gateway's own status read "Cannot find entryPoint
  # for Gateway: no matching entryPoint for port 80 and protocol HTTP", and it never became
  # Programmed/Accepted. devcluster (Task 5) sets this to 8000 to match.
  listenerPort: 80
  tls:
    enabled: false
    secretName: ""
  existing:
    name: ""
    namespace: ""
    sectionName: ""
  # Opt-in, additive path-based routing: when set, command-api/query-api also become
  # reachable under this single shared hostname via /api/command and /api/query path
  # prefixes (stripped before forwarding), and web's existing HTTPRoute also starts
  # answering on this hostname (its rule, path "/", is identical either way). Empty
  # (the default) renders nothing extra — test-e2e and production are unaffected.
  pathRouting:
    hostname: ""
