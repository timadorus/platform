apiVersion: v1
kind: Service
metadata:
  name: {{ include "timadorus-platform.fullname" . }}-web
  labels:
    {{- include "timadorus-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "timadorus-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.web.containerPort }}
      targetPort: http
